<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script src='main.js'></script>
</head>
<body>
    <div id="modal-debtor-create" class="modal" style="display: none;">
        <div id="modal-content" class="modal-content">
            <h2>Criar devedor</h2>
            <div id="info-user">
                <div class="info-debtor-container">
                    <div class="info-debtor-item">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome"></input>
                    </div>
                    <div class="info-debtor-item">
                        <label for="cpf">CPF:</label>
                        <input type="text" id="cpf" oninput="maskCPF(event)"></input>
                    </div>
                </div>
                <div class="info-debtor-container">
                    <div class="info-debtor-item">
                        <label for="email">E-mail:</label>
                        <input type="text" id="email"></input>
                    </div>
                    <div class="info-debtor-item">
                        <label for="phone">Telefone:</label>
                        <input type="text" id="phone" oninput="maskPhone(event)" maxlength="15"></input>
                    </div>
                </div>
                <div style="display: flex; justify-content: right;">
                    <button id="button-add-debt" class="btn btn-add">Adicionar debito</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
